# Generate TennisTracker.xcodeproj with:  xcodegen generate
name: TennisTracker

options:
  bundleIdPrefix: com.souravk
  deploymentTarget:
    iOS: "17.0"
    watchOS: "10.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    # Set to your Apple Developer Team ID to run on real devices.
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic

targets:
  TennisTracker:
    type: application
    platform: iOS
    sources:
      - iOSApp
      - Shared
    dependencies:
      - target: TennisTrackerWatch
    info:
      path: iOSApp/Info.plist
      properties:
        CFBundleDisplayName: TennisTracker
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.souravk.tennistracker
        TARGETED_DEVICE_FAMILY: "1"

  TennisTrackerWatch:
    type: application
    platform: watchOS
    sources:
      - WatchApp
      - Shared
    info:
      path: WatchApp/Info.plist
      properties:
        CFBundleDisplayName: TennisTracker
        WKApplication: true
        WKCompanionAppBundleIdentifier: com.souravk.tennistracker
        WKBackgroundModes: [workout-processing]
        NSHealthShareUsageDescription: TennisTracker reads your heart rate and active energy during tennis sessions.
        NSHealthUpdateUsageDescription: TennisTracker saves your tennis sessions as workouts in Apple Health.
        NSMotionUsageDescription: TennisTracker uses your watch's motion sensors to detect your strokes.
    entitlements:
      path: WatchApp/TennisTrackerWatch.entitlements
      properties:
        com.apple.developer.healthkit: true
        com.apple.developer.healthkit.access: []
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.souravk.tennistracker.watchkitapp
